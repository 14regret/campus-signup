server:
  port: 8080

spring:
  application:
    name: activity-signup

  datasource:
    # 连接串与账号全部走环境变量，仓库里不出现任何真实密码。
    # allowPublicKeyRetrieval 必须带上：MySQL 8 默认 caching_sha2_password，非 SSL 连接下缺了会报
    # "Public Key Retrieval is not allowed"
    url: "${DB_URL:jdbc:mysql://127.0.0.1:3306/campus_signup?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123}
    hikari:
      pool-name: CampusHikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000

  jpa:
    # 关掉 OSIV：实体出 service 层就是脱管的，逼着用 DTO 组装，也顺手躲掉懒加载在视图层炸的问题
    open-in-view: false
    hibernate:
      # 表结构只由 Flyway 管；validate 会在启动时就暴露实体与库结构的不一致
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 已有数据的库首次接入时置 true；新库保持 false，避免漏执行基线脚本
    baseline-on-migrate: false
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      # 本机 Redis 一般没设密码；服务端配了 requirepass 再打开这行，两边必须一致
      # password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  jackson:
    time-zone: Asia/Shanghai

# ---------------------------------------------------------------------
# 业务配置
# ---------------------------------------------------------------------
app:
  jwt:
    # 占位符：真实密钥通过环境变量 JWT_SECRET 注入，别把生产密钥提交进仓库。
    # HS256 要求 UTF-8 编码后至少 32 字节，低于该长度启动即失败并给出明确提示。
    secret: ${JWT_SECRET:dev-only-please-override-me-0123456789abcdef}
    # 有效期，支持 2h / 30m / 90s 这种写法，Boot 会绑定成 Duration
    validity: 2h
    # 签发者，解析时会校验，防止别的系统签的 token 混进来
    issuer: campus-signup

  # 启动时自动创建初始管理员（账号已存在则跳过，不会覆盖已有密码）
  admin:
    enabled: ${ADMIN_INIT_ENABLED:true}
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin12345}
    nickname: ${ADMIN_NICKNAME:系统管理员}

  cors:
    # 前端 Vite 默认 5173；多个用英文逗号分隔
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  # 活动级分布式锁。锁的 key 是 lock:activity:{activityId}
  lock:
    # 等锁最长时间，超时返回 503 + 4006，让用户重试
    wait-time: 3s
    # 锁自动过期时间，只是兜底（防止持锁线程崩溃导致活动被永久锁死）
    lease-time: 10s

  # -------------------------------------------------------------------
  # 定时任务
  # -------------------------------------------------------------------
  job:
    # 每批处理条数，避免一次把全表拉进内存
    batch-size: 200
    # PENDING 超过这个时长还没被确认，自动取消并释放名额
    pending-timeout: 24h
    # Spring cron 是 6 位：秒 分 时 日 月 周
    # 活动结束推进：每 5 分钟
    activity-status-cron: "0 */5 * * * *"
    # 超时报名清理：每 10 分钟
    signup-timeout-cron: "0 */10 * * * *"
    # 计数对账：每天凌晨 3 点
    reconcile-cron: "0 0 3 * * *"

logging:
  level:
    com.campus.signup: debug
    org.hibernate.SQL: debug
